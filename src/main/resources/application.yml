spring:
  application:
    name: ai-translator
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-flash}
        temperature: 0.1
        thinking:
          type: disabled
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
  web:
    error:
      include-message: never

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  translation:
    chunk-size: 4000
    max-text-length: 20000
    glossary-chunk-size: 12000
    context-max-characters: 2000
  document:
    max-bytes: 10485760
    max-characters: 100000
    max-pages: 100
    pdf-min-text-characters: 20
  ocr:
    data-path: ${TESSDATA_PREFIX:"C:/Program Files/Tesseract-OCR/tessdata"}
    dpi: 300
